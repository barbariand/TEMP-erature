[package]
name = "wasm-backend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"] # Compile to a C-style dynamic library for WASM

[dependencies]

[build-dependencies]
cc = { version = "1.2.43", features = ["parallel"] }
bindgen = "0.72"
# New: For copying the directory
fs_extra = "1.3"
# New: For finding all the .c files in the lvgl source
glob = "0.3"
which = "8.0.0"
